name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-vectors:
    name: PHP ${{ matrix.php }} — lint + golden vectors
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint all PHP files
        run: |
          set -e
          for f in wp-portal-bridge.php includes/*.php tests/*.php; do
            php -l "$f"
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vectors are current (generator output matches committed file)
        run: |
          node tools/generate-vectors.mjs
          git diff --exit-code tests/vectors/hmac-vectors.json

      - name: PHP golden vector conformance
        run: php tests/test-auth-vectors.php
